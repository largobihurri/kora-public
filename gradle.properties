# Gradle
# This machine is shared with other projects (15 GB RAM): keep the footprint small and release
# memory quickly. The daemon exits after 10 idle minutes instead of the default 3 hours.
org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.daemon.idletimeout=600000
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin
kotlin.code.style=official
# Compile inside the Gradle daemon instead of a separate, long-lived Kotlin daemon.
kotlin.compiler.execution.strategy=in-process

# Android
android.useAndroidX=true
